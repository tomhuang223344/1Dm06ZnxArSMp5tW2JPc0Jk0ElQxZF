<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>鵜鶘騎自行車動畫</title>
    <style>
        body {
            margin: 0;
            background-color: #fdf6e3; /* 淺黃色背景模擬天空 */
            font-family: 'Microsoft JhengHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .scene {
            position: relative;
            width: 800px;
            height: 400px;
            border-radius: 20px;
            background: linear-gradient(to bottom, #fdf6e3 0%, #eee5cc 100%);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        /* 地面 */
        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60px;
            background-color: #b8a75f; /* 泥土色 */
            border-radius: 0 0 20px 20px;
        }

        /* 自行車輪子轉動容器 */
        .wheels-container {
            position: absolute;
            bottom: 60px;
            left: -100px; /* 初始位置在畫布左側外 */
            width: 280px;
            animation: moveForward 3s linear infinite;
        }

        .wheel {
            position: absolute;
            width: 140px;
            height: 140px;
            border: 6px solid #333;
            background-color: rgba(255,255,255,0.8);
            border-radius: 50%;
        }

        .wheel-front {
            left: 0;
            animation: rotateWheel 0.1s linear infinite;
        }
        
        .wheel-back {
            right: 0;
            animation: rotateWheel 0.1s linear infinite;
        }

        /* 車架和把手 */
        .bike-frame {
            position: absolute;
            bottom: 60px;
            left: 20px;
            width: 240px;
            height: 80px;
            
            --frame-color: #d35400; /* 橘色車架 */
        }

        .main-frame {
            position: absolute;
            top: 10px;
            left: 40px;
            width: 200px;
            height: 6px;
            background-color: var(--frame-color);
            border-radius: 3px;
        }

        .handlebar-post {
            position: absolute;
            top: 10px;
            left: 80px;
            width: 4px;
            height: 50px;
            background-color: #666;
            transform-origin: bottom center;
        }

        .handlebars {
            position: absolute;
            top: -35px;
            left: 20px;
            width: 60px;
            height: 10px;
            background-color: var(--frame-color);
            border-radius: 5px;
        }

        .seat-post {
            position: absolute;
            bottom: 40px;
            right: 80px;
            width: 4px;
            height: 60px;
            background-color: #666;
            transform-origin: top center;
        }

        .seat {
            position: absolute;
            bottom: -10px;
            left: -20px;
            width: 50px;
            height: 15px;
            background-color: var(--frame-color);
            border-radius: 10px;
        }

        /* 鵜鶘身體 */
        .cormorant {
            position: absolute;
            bottom: 90px; /* 踩在座位上高度 */
            left: 60px;   /* 初始相對車架位置 */
            
            --body-color: #34495e; /* 鵜鶘深灰色 */

        }

        .head {
            position: absolute;
            top: -20px;
            left: -10px;
            width: 40px;
            height: 40px;
            background-color: var(--body-color);
            border-radius: 50% 30% 60% 80% / 70% 70% 30% 30%;
        }

        .beak {
            position: absolute;
            top: 25px;
            left: 10px;
            width: 20px;
            height: 12px;
            background-color: #f1c40f; /* 黃色鴨嘴 */
            border-top-left-radius: 50%;
            border-bottom-right-radius: 50%;
            transform: skewX(15deg);
        }

        .eye {
            position: absolute;
            top: 10px;
            left: 20px;
            width: 8px;
            height: 8px;
            background-color: white;
            border-radius: 50%;
            box-shadow: -2px -2px 2px rgba(0,0,0,0.3);
        }

        .pupil {
            position: absolute;
            top: 4px;
            left: 4px;
            width: 3px;
            height: 3px;
            background-color: black;
            border-radius: 50%;
        }

        .body {
            position: absolute;
            bottom: -20px;
            right: -10px;
            width: 80px;
            height: 60px;
            background-color: var(--body-color);
            border-radius: 40% / 70%;
        }

        .wing {
            position: absolute;
            top: -5px;
            left: 20px;
            width: 30px;
            height: 15px;
            background-color: #ecf0f1; /* 較淺色翅膀 */
            border-radius: 50%;
            transform-origin: center right;
            animation: flapWing 0.2s ease-in-out infinite alternate;
        }

        .feet {
            position: absolute;
            bottom: -30px;
            left: 10px;
            width: 60px;
            height: 5px;
            background-color: #f1c40f; /* 黃色腳 */
            display: flex;
            gap: 20px;
        }

        .toe {
            position: absolute;
            top: -8px;
            width: 3px;
            height: 15px;
            background-color: #f1c40f;
        }
        
        /* 腳的動畫 (模擬踩踏) */
        .toe-left { left: 5px; animation: pedalLeft 0.3s linear infinite alternate; }
        .toe-right { right: 5px; animation: pedalRight 0.3s linear infinite alternate; }

        /* 動畫定義 */

        /* 鵜鶘與自行車整體移動 */
        @keyframes moveForward {
            0% { left: -100px; }
            100% { left: 700px; } /* 從左跑到右 */
        }

        /* 輪子轉動 */
        @keyframes rotateWheel {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 腳踩踏板 (模擬) */
        @keyframes pedalLeft {
            0% { top: -8px; }
            100% { top: -25px; }
        }
        @keyframes pedalRight {
            0% { top: -25px; }
            100% { top: -8px; }
        }

        /* 翅膀拍動 */
        @keyframes flapWing {
            from { transform: rotate(-15deg); }
            to { transform: rotate(15deg); }
        }

    </style>
</head>
<body>

<div class="scene">
    <div class="ground"></div>
    
    <!-- 自行車整體移動層 -->
    <div class="wheels-container">
        
        <!-- 輪子 -->
        <div class="wheel wheel-front"></div>
        <div class="wheel wheel-back"></div>

        <!-- 車架 -->
        <div class="bike-frame">
            <div class="main-frame"></div>
            
            <!-- 把手 (微細抖動效果) -->
            <div class="handlebar-post"></div>
            <div class="handlebars" style="
                animation: handleShake 0.2s ease-in-out infinite alternate;
                position: absolute;
                top: -35px;
                left: 20px;
                width: 60px;
                height: 10px;
                background-color: #d35400;
                border-radius: 5px;
            "></div>

            <!-- 座位 -->
            <div class="seat-post"></div>
            <div class="seat"></div>
        </div>

        <!-- 鵜鶘 (跟隨自行車移動) -->
        <div class="cormorant">
            <div class="head">
                <div class="beak"></div>
                <div class="eye"><div class="pupil"></div></div>
            </div>
            <div class="body"></div>
            <div class="wing" style="
                animation: flapWing 0.3s ease-in-out infinite alternate;
            "></div>
            
            <!-- 腳 -->
            <div class="feet">
                <div class="toe toe-left"></div>
                <div class="toe toe-right"></div>
            </div>
        </div>

    </div>
</div>

<style>
    /* 把手抖動定義 (修正樣式衝突) */
    @keyframes handleShake {
        0% { transform: rotate(-2deg); }
        100% { transform: rotate(2deg); }
    }
</style>

</body>
</html>
