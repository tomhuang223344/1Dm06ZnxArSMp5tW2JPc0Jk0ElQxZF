<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🪿 鵜鶘騎自行車</title>
<style>
  :root{
    --cycle-dur: .9s;
    --road-dur:  .5s;
    --bg-top:#8ec9ff; --bg-bot:#d7f0ff; --sun:#ffe27a; --ground:#7cc36b;
  }
  body.night{
    --bg-top:#122447; --bg-bot:#33507e; --sun:#f3f2c9; --ground:#2c4d3e;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:"Segoe UI","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:22px;padding:24px;color:#233;
    background:radial-gradient(circle at 50% -10%,#fff6,transparent 60%);
    transition:background .6s,color .6s;
  }
  h1{margin:0;font-size:clamp(22px,4vw,34px);}
  p.sub{margin:-8px 0 0;opacity:.7;}

  /* ====== 場景 ====== */
  .scene{
    position:relative;width:min(92vw,640px);height:min(58vh,380px);
    border-radius:24px;overflow:hidden;
    background:linear-gradient(var(--bg-top),var(--bg-bot));
    box-shadow:0 18px 40px rgba(0,0,0,.25);transition:background .6s;
  }

  /* 天空元素 */
  .sun{position:absolute;top:34px;right:52px;width:64px;height:64px;border-radius:50%;
       background:var(--sun);box-shadow:0 0 55px 14px rgba(255,225,130,.6);transition:.6s;}
  .stars{position:absolute;inset:0;opacity:0;transition:opacity .8s;pointer-events:none;}
  body.night .stars{opacity:1;}
  .star{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;
        animation:twinkle 2.4s infinite ease-in-out;}
  @keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}

  .cloud{position:absolute;height:26px;background:#ffffffcc;border-radius:30px;filter:blur(.4px);
         animation:drift linear infinite;}
  .cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%;}
  .cloud::before{width:42px;height:42px;top:-18px;left:14px;}
  .cloud::after{width:32px;height:32px;top:-12px;right:16px;}
  .c1{top:46px;width:90px;animation-duration:22s;}
  .c2{top:96px;width:64px;animation-duration:30s;opacity:.85;}
  .c3{top:26px;width:72px;animation-duration:17s;opacity:.9;}
  @keyframes drift{from{left:105%}to{left:-35%}}

  /* 地面 */
  .ground{position:absolute;left:0;right:0;bottom:0;height:62px;background:var(--ground);transition:.6s;}
  .road{position:absolute;left:0;right:0;bottom:34px;height:30px;background:#55606c;}
  .road::before{content:"";position:absolute;top:50%;left:0;width:200%;height:4px;margin-top:-2px;
    background:repeating-linear-gradient(90deg,#ffe9a8 0 34px,transparent 34px 78px);
    animation:dash var(--road-dur) linear infinite;}
  @keyframes dash{from{transform:translateX(0)}to{transform:translateX(-112px)}}

  /* ====== 鵜鶘 + 自行車 ====== */
  .pelican{position:absolute;left:50%;bottom:38px;width:240px;height:230px;
           transform:translateX(-64%);animation:bob var(--cycle-dur) ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateX(-64%) translateY(0)}50%{transform:translateX(-64%) translateY(-3px)}}

  .svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
  /* 後輪、前輪繞中心自轉 */
  .wheel-spin{transform-box:fill-box;transform-origin:center;animation:spin var(--cycle-dur) linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .crank{transform-box:fill-box;transform-origin:center;animation:spin var(--cycle-dur) linear infinite;}

  /* 鵷腿踩踏（交替擺動） */
  .leg{transform-box:view-box;transform-origin:128px 108px;}
  .leg.back{animation:pedalA var(--cycle-dur) ease-in-out infinite;}
  .leg.front{animation:pedalB var(--cycle-dur) ease-in-out infinite;}
  @keyframes pedalA{0%,100%{transform:rotate(9deg)}50%{transform:rotate(-9deg)}}
  @keyframes pedalB{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}

  /* ====== 控制面板 ====== */
  .controls{display:flex;flex-wrap:wrap;gap:22px;align-items:center;justify-content:center;
            background:#ffffffb0;padding:14px 22px;border-radius:16px;backdrop-filter:blur(6px);
            box-shadow:0 8px 20px rgba(0,0,0,.12);}
  body.night .controls{background:#ffffff1a;color:#eaf;}
  .ctrl{display:flex;align-items:center;gap:10px;font-size:14px;}
  input[type=range]{width:150px;accent-color:#f79b2e;}
  button{cursor:pointer;border:none;padding:8px 16px;border-radius:10px;font-size:14px;font-weight:600;
         background:#f79b2e;color:#fff;transition:.2s;}
  button:hover{filter:brightness(1.08);transform:translateY(-1px);}
</style>
</head>
<body>
  <h1>🚴 鵜鶘騎自行車 🪿</h1>
  <p class="sub">CSS 手繪動畫 · 可調速度 / 晝夜切換</p>

  <div class="scene" id="scene">
    <div class="sun"></div>
    <div class="stars" id="stars"></div>
    <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>

    <div class="pelican">
      <svg class="svg" viewBox="0 0 240 230">
        <!-- ===== 自行車 ===== -->
        <g stroke="#3a3f47" stroke-width="5" fill="none" stroke-linecap="round">
          <!-- 車架 -->
          <line x1="60" y1="180" x2="120" y2="180"/>
          <line x1="60" y1="180" x2="95" y2="112"/>
          <line x1="120" y1="180" x2="150" y2="112"/>
          <line x1="95" y1="112" x2="150" y2="112"/>
          <line x1="120" y1="180" x2="95" y2="112"/>
          <!-- 前叉 & 把手 -->
          <line x1="180" y1="180" x2="164" y2="96"/>
          <path d="M164 96 q-14 -6 -22 2"/>
          <!-- 座管 & 坐墊 -->
          <line x1="95" y1="112" x2="80" y2="86"/>
        </g>
        <rect x="66" y="80" width="30" height="9" rx="4.5" fill="#2b2f36"/>

        <!-- 後輪 -->
        <g transform="translate(60,180)">
          <circle r="38" fill="none" stroke="#2b2f36" stroke-width="7"/>
          <circle r="5" fill="#2b2f36"/>
          <g class="wheel-spin">
            <line x1="-34" y1="0" x2="34" y2="0"/><line x1="0" y1="-34" x2="0" y2="34"/>
            <line x1="-24" y1="-24" x2="24" y2="24"/><line x1="-24" y1="24" x2="24" y2="-24"/>
          </g>
        </g>
        <!-- 前輪 -->
        <g transform="translate(180,180)">
          <circle r="38" fill="none" stroke="#2b2f36" stroke-width="7"/>
          <circle r="5" fill="#2b2f36"/>
          <g class="wheel-spin">
            <line x1="-34" y1="0" x2="34" y2="0"/><line x1="0" y1="-34" x2="0" y2="34"/>
            <line x1="-24" y1="-24" x2="24" y2="24"/><line x1="-24" y1="24" x2="24" y2="-24"/>
          </g>
        </g>

        <!-- 曲柄 & 踏板 -->
        <g class="crank">
          <circle r="9" fill="#5a636e" stroke="#3a3f47" stroke-width="3"/>
          <line x1="-20" y1="0" x2="20" y2="0" stroke="#3a3f47" stroke-width="5"/>
          <rect x="14" y="-3" width="14" height="6" rx="2" fill="#3a3f47"/>
          <rect x="-28" y="-3" width="14" height="6" rx="2" fill="#3a3f47"/>
        </g>

        <!-- ===== 鵜鶘（面向右） ===== -->
        <!-- 尾羽 -->
        <path d="M50 92 q-28 -6 -34 12 q22 6 40 -2 Z" fill="#dfe7ef"/>
        <!-- 腿（鵷蹼） -->
        <g class="leg back"><line x1="128" y1="108" x2="112" y2="150" stroke="#e8963c" stroke-width="7" stroke-linecap="round"/></g>
        <g class="leg front"><line x1="128" y1="108" x2="146" y2="150" stroke="#f7a94b" stroke-width="7" stroke-linecap="round"/></g>

        <!-- 身體 -->
        <path d="M70 118 Q72 78 122 80 Q168 82 165 116 Q163 146 116 146 Q74 146 70 118 Z" fill="#f4f8fc"/>
        <path d="M96 140 Q120 150 150 138 Q140 150 116 150 Q104 150 96 140Z" fill="#dde7f0"/>
        <!-- 翅膀 -->
        <path d="M92 96 Q132 92 148 120 Q120 132 96 118 Q86 106 92 96 Z" fill="#dbe5ef"/>

        <!-- 脖子 -->
        <path d="M150 96 C150 64 176 58 183 74 L171 104 C166 92 156 92 150 104 Z" fill="#eef4fa"/>
        <!-- 頭 -->
        <circle cx="186" cy="72" r="17" fill="#f4f8fc"/>

        <!-- 大嘴 + 喉囊 -->
        <path d="M198 65 Q238 58 234 70 Q230 80 200 76 Z" fill="#f7a94b"/>
        <path d="M200 74 Q230 78 231 94 Q214 106 200 92 Q195 82 200 74 Z" fill="#fbd08a"/>
        <path d="M205 82 Q216 90 226 86" stroke="#e8963c" stroke-width="2" fill="none"/>

        <!-- 眼睛 -->
        <circle cx="190" cy="67" r="4.6" fill="#fff"/><circle cx="191.5" cy="67" r="2.6" fill="#23272e"/>

        <!-- 手臂抓把手 -->
        <path d="M128 100 Q150 104 168 100" stroke="#dbe5ef" stroke-width="9" fill="none" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="road"></div>
    <div class="ground"></div>
  </div>

  <div class="controls">
    <div class="ctrl">🐢 速度 <input type="range" id="speed" min="0.35" max="1.8" step="0.05" value="0.9"> 🐇</div>
    <button id="toggle">🌙 夜間模式</button>
  </div>

<script>
  const scene = document.getElementById('scene');
  // 產生星星
  const starsEl = document.getElementById('stars');
  for(let i=0;i<45;i++){
    const s=document.createElement('div');s.className='star';
    s.style.left=Math.random()*100+'%';
    s.style.top=Math.random()*55+'%';
    s.style.animationDelay=(Math.random()*2.4)+'s';
    starsEl.appendChild(s);
  }
  // 速度控制：滑桿值 = 單圈秒數，越小越快
  const speed=document.getElementById('speed');
  function setDur(){const d=speed.value+'s';scene.style.setProperty('--cycle-dur',d);scene.style.setProperty('--road-dur',(speed.value*0.55)+'s');}
  speed.addEventListener('input',setDur);setDur();
  // 晝夜切換
  document.getElementById('toggle').addEventListener('click',e=>{
    const night=document.body.classList.toggle('night');
    e.target.textContent=night?'☀️ 日間模式':'🌙 夜間模式';
  });
</script>
</body>
</html>
