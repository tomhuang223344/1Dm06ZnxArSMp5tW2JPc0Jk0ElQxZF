<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AORUS 3D 全景展示廳</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#05060a;color:#e8ecf5;font-family:'Noto Sans TC',sans-serif;overflow:hidden;height:100vh}
#stage{position:fixed;inset:0;cursor:grab}
#stage:active{cursor:grabbing}
header{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:flex-start;padding:22px 28px;pointer-events:none}
h1{font-family:'Orbitron';font-size:clamp(20px,3.4vw,34px);font-weight:800;letter-spacing:4px;
   background:linear-gradient(90deg,#c26bff,#5ad7ff);-webkit-background-clip:text;background-clip:text;color:transparent;
   filter:drop-shadow(0 0 14px rgba(140,80,255,.45))}
h1 small{display:block;font-family:'Noto Sans TC';font-size:12px;font-weight:700;letter-spacing:6px;color:#8b93a8;-webkit-text-fill-color:#8b93a8;margin-top:4px}
.tips{font-size:12px;color:#8b93a8;text-align:right;line-height:2}
.tips b{color:#5ad7ff}
/* 底部控制列 */
.bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:10;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;
     background:rgba(10,12,20,.72);border:1px solid #262b3d;border-radius:16px;padding:10px 14px;backdrop-filter:blur(10px)}
.bar .group{display:flex;gap:6px;align-items:center}
.bar .sep{width:1px;height:22px;background:#262b3d}
button.v{font:700 13px 'Noto Sans TC';letter-spacing:1px;color:#cdd4e6;background:#141827;border:1px solid #2b3147;border-radius:10px;padding:8px 13px;cursor:pointer;transition:.15s}
button.v:hover{border-color:#5ad7ff;color:#5ad7ff;transform:translateY(-1px)}
button.v.on{background:linear-gradient(90deg,#7a2bff,#2ba8ff);border-color:transparent;color:#fff;box-shadow:0 0 16px rgba(120,60,255,.5)}
.lid{display:flex;align-items:center;gap:8px;font-size:12px;color:#8b93a8}
.lid input{width:110px;accent-color:#c26bff}
/* 右側縮圖 */
.gallery{position:fixed;right:16px;top:50%;transform:translateY(-50%);z-index:10;display:flex;flex-direction:column;gap:8px}
.gallery button{width:64px;height:64px;border-radius:12px;border:2px solid #262b3d;overflow:hidden;padding:0;cursor:pointer;background:#0d1019;transition:.15s}
.gallery button:hover{border-color:#5ad7ff;transform:scale(1.06)}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.gallery button span{display:none}
@media (max-width:720px){.gallery{flex-direction:row;right:auto;left:50%;top:auto;bottom:86px;transform:translateX(-50%)} .tips{display:none}}
#err{position:fixed;inset:0;display:none;place-items:center;z-index:99;background:#05060a;font-size:15px;color:#8b93a8;text-align:center;line-height:2}
</style>
</head>
<body>
<div id="stage"></div>

<header>
  <h1>AORUS<small>3D 全景展示廳 ・ TEAM UP . FIGHT ON</small></h1>
  <div class="tips"><b>拖曳</b> 任意旋轉 ・ <b>滾輪／雙指</b> 縮放<br><b>右側縮圖</b> 切換視角 ・ <b>滑桿</b> 開闔螢幕</div>
</header>

<div class="gallery" id="gallery"></div>

<div class="bar">
  <div class="group">
    <button class="v" data-p="angle">斜前</button>
    <button class="v" data-p="front">正面</button>
    <button class="v" data-p="top">頂部</button>
    <button class="v" data-p="back">背面</button>
    <button class="v" data-p="bottom">底部</button>
  </div>
  <div class="sep"></div>
  <div class="group"><button class="v on" id="autoBtn">自動旋轉</button></div>
  <div class="sep"></div>
  <label class="lid">開闔<input type="range" id="lidRange" min="0" max="115" value="105"><span id="lidVal">105°</span></label>
</div>

<div id="err">無法載入 Three.js<br>請檢查網路連線後重新整理</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
if(!window.THREE){ document.getElementById('err').style.display='grid'; }
else (function(){
'use strict';
/* ---------- 場景 ---------- */
const stage=document.getElementById('stage');
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x05060a,16,42);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(2,devicePixelRatio));
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x05060a);
stage.appendChild(renderer.domElement);
const ANISO=renderer.capabilities.getMaxAnisotropy();

/* 燈光：電競紫/藍氛圍 */
scene.add(new THREE.AmbientLight(0x334,0.9));
const key=new THREE.DirectionalLight(0xffffff,0.9); key.position.set(4,6,6); scene.add(key);
const p1=new THREE.PointLight(0x8a2bff,1.1,30); p1.position.set(-6,3,-4); scene.add(p1);
const p2=new THREE.PointLight(0x2ba8ff,1.0,30); p2.position.set(6,2,5); scene.add(p2);

/* 地板 + 粒子 */
const floor=new THREE.Mesh(new THREE.CircleGeometry(14,48),
  new THREE.MeshStandardMaterial({color:0x0a0d14,roughness:.95}));
floor.rotation.x=-Math.PI/2; floor.position.y=-1.35; scene.add(floor);
const ring=new THREE.Mesh(new THREE.RingGeometry(4.2,4.26,64),
  new THREE.MeshBasicMaterial({color:0x2b2140,side:THREE.DoubleSide}));
ring.rotation.x=-Math.PI/2; ring.position.y=-1.34; scene.add(ring);
const pGeo=new THREE.BufferGeometry(),pN=220,pPos=new Float32Array(pN*3);
for(let i=0;i<pN;i++){pPos[i*3]=(Math.random()-.5)*26;pPos[i*3+1]=Math.random()*9-1.5;pPos[i*3+2]=(Math.random()-.5)*26;}
pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
const particles=new THREE.Points(pGeo,new THREE.PointsMaterial({color:0x7a5cff,size:.035,transparent:true,opacity:.55}));
scene.add(particles);

/* ---------- 貼圖：從 5 張圖裁取，缺圖用 placeholder ---------- */
function placeholder(label){
  const c=document.createElement('canvas');c.width=1024;c.height=640;
  const x=c.getContext('2d');
  const g=x.createRadialGradient(512,320,60,512,320,700);
  g.addColorStop(0,'#3a1160');g.addColorStop(.5,'#140a26');g.addColorStop(1,'#07060c');
  x.fillStyle=g;x.fillRect(0,0,1024,640);
  x.fillStyle='#c26bff';x.font='900 110px Orbitron, sans-serif';x.textAlign='center';x.textBaseline='middle';
  x.fillText('AORUS',512,300);
  x.fillStyle='#8b93a8';x.font='28px sans-serif';x.fillText(label,512,410);
  return c;
}
function cropTex(url,crop,label){
  const tex=new THREE.CanvasTexture(placeholder(label)); tex.anisotropy=ANISO;
  const img=new Image();
  img.onload=()=>{
    const sw=img.width*crop.w, sh=img.height*crop.h;
    const c=document.createElement('canvas'); c.width=1024; c.height=Math.max(2,Math.round(1024*sh/sw));
    c.getContext('2d').drawImage(img,img.width*crop.x,img.height*crop.y,sw,sh,0,0,c.width,c.height);
    tex.image=c; tex.needsUpdate=true;
  };
  img.src=url; return tex;
}
const texScreen =cropTex('front.png',{x:.175,y:.275,w:.65,h:.40},'螢幕');
const texDeck   =cropTex('top.png',  {x:.17 ,y:.385,w:.66,h:.475},'鍵盤面');
const texBottom =cropTex('bottom.png',{x:.165,y:.26,w:.67,h:.48},'底部');
texBottom.center.set(.5,.5); texBottom.rotation=Math.PI;
const texLid    =cropTex('back.png',{x:.20,y:.21,w:.68,h:.55},'A 面');

/* RGB 燈條貼圖（流動漸層） */
const barCanvas=document.createElement('canvas');barCanvas.width=256;barCanvas.height=8;
const bctx=barCanvas.getContext('2d');
const bg=bctx.createLinearGradient(0,0,256,0);
bg.addColorStop(0,'#ff2bd6');bg.addColorStop(.5,'#7a2bff');bg.addColorStop(1,'#2bd6ff');
bctx.fillStyle=bg;bctx.fillRect(0,0,256,8);
const barTex=new THREE.CanvasTexture(barCanvas);
barTex.wrapS=THREE.RepeatWrapping;
const barMat=new THREE.MeshBasicMaterial({map:barTex,toneMapped:false});

/* ---------- 筆電模型 ---------- */
const W=3.4,D=2.3,BH=.14,LH=2.2,LT=.09;
const dark=new THREE.MeshStandardMaterial({color:0x0b0d12,roughness:.55,metalness:.5});
const rig=new THREE.Group(); scene.add(rig);
const laptop=new THREE.Group(); rig.add(laptop);

const base=new THREE.Mesh(new THREE.BoxGeometry(W,BH,D),dark); laptop.add(base);
const deck=new THREE.Mesh(new THREE.PlaneGeometry(W*.98,D*.98),
  new THREE.MeshStandardMaterial({map:texDeck,roughness:.7,metalness:.25}));
deck.rotation.x=-Math.PI/2; deck.position.y=BH/2+.003; laptop.add(deck);
const bottom=new THREE.Mesh(new THREE.PlaneGeometry(W*.97,D*.97),
  new THREE.MeshStandardMaterial({map:texBottom,roughness:.8,metalness:.2}));
bottom.rotation.x=Math.PI/2; bottom.position.y=-BH/2-.003; laptop.add(bottom);
const barF=new THREE.Mesh(new THREE.PlaneGeometry(W*.8,.035),barMat);
barF.position.set(0,-.02,D/2+.004); laptop.add(barF);
const barB=new THREE.Mesh(new THREE.PlaneGeometry(W*.8,.035),barMat);
barB.rotation.y=Math.PI; barB.position.set(0,-.02,-D/2-.004); laptop.add(barB);

const hinge=new THREE.Group(); hinge.position.set(0,BH/2,-D/2); laptop.add(hinge);
const lid=new THREE.Mesh(new THREE.BoxGeometry(W,LH,LT),dark); lid.position.y=LH/2; hinge.add(lid);
const screen=new THREE.Mesh(new THREE.PlaneGeometry(W*.94,LH*.92),
  new THREE.MeshBasicMaterial({map:texScreen,toneMapped:false}));
screen.position.set(0,LH/2,LT/2+.004); hinge.add(screen);
const lidOuter=new THREE.Mesh(new THREE.PlaneGeometry(W*.98,LH*.97),
  new THREE.MeshStandardMaterial({map:texLid,roughness:.6,metalness:.35}));
lidOuter.rotation.y=Math.PI; lidOuter.position.set(0,LH/2,-LT/2-.004); hinge.add(lidOuter);
const barR=new THREE.Mesh(new THREE.PlaneGeometry(W*.85,.04),barMat);
barR.rotation.y=Math.PI; barR.position.set(0,.06,-LT/2-.006); hinge.add(barR);

function setLid(deg){ hinge.rotation.x=THREE.MathUtils.degToRad(90-deg); }
setLid(105);
laptop.position.y=-.4;

/* ---------- 視角控制（任意角度） ---------- */
let yaw=.65,pitch=.3,zoom=8.5, tYaw=yaw,tPitch=pitch,tZoom=zoom;
let auto=true,lastTouch=0,dragging=false,px=0,py=0;
const pointers=new Map(); let pinchD=0;

const PRESETS={angle:{y:.65,p:.3},front:{y:0,p:.08},top:{y:0,p:1.28},back:{y:Math.PI,p:.22},bottom:{y:0,p:-1.28}};
function goPreset(k){
  const p=PRESETS[k]; tPitch=p.p;
  const dy=Math.atan2(Math.sin(p.y-tYaw),Math.cos(p.y-tYaw));
  tYaw+=dy; lastTouch=performance.now();
}
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>goPreset(b.dataset.p));
const autoBtn=document.getElementById('autoBtn');
autoBtn.onclick=()=>{auto=!auto;autoBtn.classList.toggle('on',auto);};

const el=renderer.domElement;
el.addEventListener('pointerdown',e=>{
  pointers.set(e.pointerId,[e.clientX,e.clientY]);
  if(pointers.size===1){dragging=true;px=e.clientX;py=e.clientY;}
  else if(pointers.size===2){const a=[...pointers.values()];pinchD=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);}
  lastTouch=performance.now(); el.setPointerCapture(e.pointerId);
});
el.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId))return;
  pointers.set(e.pointerId,[e.clientX,e.clientY]);
  if(pointers.size===1&&dragging){
    tYaw+=(e.clientX-px)*.0055;
    tPitch=THREE.MathUtils.clamp(tPitch+(e.clientY-py)*.0055,-1.5,1.5);
    px=e.clientX;py=e.clientY;
  }else if(pointers.size===2){
    const a=[...pointers.values()];const d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);
    tZoom=THREE.MathUtils.clamp(tZoom-(d-pinchD)*.02,4.5,15); pinchD=d;
  }
  lastTouch=performance.now();
});
['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,e=>{
  pointers.delete(e.pointerId); if(pointers.size===0)dragging=false;
}));
el.addEventListener('wheel',e=>{e.preventDefault();
  tZoom=THREE.MathUtils.clamp(tZoom+e.deltaY*.008,4.5,15); lastTouch=performance.now();
},{passive:false});

/* 開闔滑桿 */
const lidRange=document.getElementById('lidRange');
lidRange.addEventListener('input',()=>{setLid(+lidRange.value);document.getElementById('lidVal').textContent=lidRange.value+'°';});

/* 右側縮圖（缺圖自動隱藏） */
const gal=document.getElementById('gallery');
[['angle','斜前'],['front','正面'],['top','頂部'],['back','背面'],['bottom','底部']].forEach(([k,label])=>{
  const file={angle:'angle.png',front:'front.png',top:'top.png',back:'back.png',bottom:'bottom.png'}[k];
  const b=document.createElement('button'); b.title=label;
  b.innerHTML=`<img src="${file}" alt="${label}" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><span style="display:grid;place-items:center;height:100%;font-size:12px;color:#8b93a8">${label}</span>`;
  b.onclick=()=>goPreset(k); gal.appendChild(b);
});

/* ---------- 動畫迴圈 ---------- */
let prev=performance.now();
function loop(t){
  requestAnimationFrame(loop);
  const dt=(t-prev)/1000; prev=t;
  if(auto && t-lastTouch>2500) tYaw+=dt*.25;
  yaw+=(tYaw-yaw)*.08; pitch+=(tPitch-pitch)*.08; zoom+=(tZoom-zoom)*.1;
  rig.rotation.y=yaw; rig.rotation.x=pitch;
  camera.position.set(0,1.1,zoom); camera.lookAt(0,.35,0);
  barTex.offset.x-=dt*.35;           /* 燈條流動 */
  particles.rotation.y+=dt*.02;
  renderer.render(scene,camera);
}
requestAnimationFrame(loop);

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
})();
</script>
</body>
</html>
