<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>檔案目錄</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Noto Sans SC", "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
    }
    .container {
      max-width: 700px;
      width: 100%;
    }
    h1 {
      font-size: 36px;
      font-weight: 200;
      color: #ffffff;
      margin-bottom: 10px;
      text-align: center;
    }
    .subtitle {
      text-align: center;
      color: rgba(255,255,255,0.4);
      font-size: 14px;
      margin-bottom: 50px;
      font-family: "JetBrains Mono", monospace;
      letter-spacing: 0.1em;
    }
    .file-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .file-item {
      background: #141414;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: background 0.3s, border-color 0.3s, transform 0.2s;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }
    .file-item:hover {
      background: #1a1a1a;
      border-color: #002FA7;
      transform: translateX(4px);
    }
    .file-icon {
      font-size: 24px;
      flex-shrink: 0;
    }
    .file-info {
      flex: 1;
    }
    .file-name {
      font-size: 18px;
      font-weight: 500;
      color: #ffffff;
      margin-bottom: 4px;
    }
    .file-meta {
      font-size: 13px;
      color: rgba(255,255,255,0.35);
      font-family: "JetBrains Mono", monospace;
      letter-spacing: 0.05em;
    }
    .file-arrow {
      color: rgba(255,255,255,0.2);
      font-size: 18px;
      flex-shrink: 0;
    }
    .footer {
      margin-top: 60px;
      font-size: 13px;
      color: rgba(255,255,255,0.2);
      font-family: "JetBrains Mono", monospace;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>檔案目錄</h1>
    <p class="subtitle">FILES LISTING</p>
    <ul class="file-list" id="fileList"></ul>
    <div class="footer">根目錄所有檔案</div>
  </div>

  <script>
    const files = [
      {
        name: "fukuoka-pptxgen.html",
        desc: "日本福岡 5天4夜 PPT風格行程攻略",
        icon: "🗺️",
        url: "fukuoka-pptxgen.html",
        size: "58.8 KB"
      },
      {
        name: "index.html",
        desc: "檔案目錄首頁",
        icon: "📋",
        url: "index.html",
        size: "3.3 KB"
      }
    ];

    const listEl = document.getElementById('fileList');
    files.forEach(f => {
      const li = document.createElement('li');
      li.className = 'file-item';
      li.innerHTML = `
        <span class="file-icon">${f.icon}</span>
        <div class="file-info">
          <div class="file-name">${f.name}</div>
          <div class="file-meta">${f.desc} · ${f.size}</div>
        </div>
        <span class="file-arrow">→</span>
      `;
      li.addEventListener('click', () => {
        window.location.href = f.url;
      });
      listEl.appendChild(li);
    });
  </script>
</body>
</html>
