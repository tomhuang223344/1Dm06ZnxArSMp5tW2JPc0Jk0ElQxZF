<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>檔案目錄</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Noto Sans SC", "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
    }
    .container {
      max-width: 700px;
      width: 100%;
    }
    h1 {
      font-size: 36px;
      font-weight: 200;
      color: #ffffff;
      margin-bottom: 10px;
      text-align: center;
    }
    .subtitle {
      text-align: center;
      color: rgba(255,255,255,0.4);
      font-size: 14px;
      margin-bottom: 50px;
      font-family: "JetBrains Mono", monospace;
      letter-spacing: 0.1em;
    }
    .file-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .file-item {
      background: #141414;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: background 0.3s, border-color 0.3s, transform 0.2s;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }
    .file-item:hover {
      background: #1a1a1a;
      border-color: #002FA7;
      transform: translateX(4px);
    }
    .file-icon {
      font-size: 24px;
      flex-shrink: 0;
    }
    .file-info {
      flex: 1;
    }
    .file-name {
      font-size: 18px;
      font-weight: 500;
      color: #ffffff;
      margin-bottom: 4px;
    }
    .file-meta {
      font-size: 13px;
      color: rgba(255,255,255,0.35);
      font-family: "JetBrains Mono", monospace;
      letter-spacing: 0.05em;
    }
    .file-arrow {
      color: rgba(255,255,255,0.2);
      font-size: 18px;
      flex-shrink: 0;
    }
    .footer {
      margin-top: 60px;
      font-size: 13px;
      color: rgba(255,255,255,0.2);
      font-family: "JetBrains Mono", monospace;
      text-align: center;
    }
    #loading {
      text-align: center;
      color: rgba(255,255,255,0.5);
      font-family: "JetBrains Mono", monospace;
      letter-spacing: 0.1em;
      padding: 40px 0;
    }
    #error {
      text-align: center;
      color: #ff6b6b;
      font-family: "JetBrains Mono", monospace;
      padding: 40px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>檔案目錄</h1>
    <p class="subtitle">FILES LISTING</p>
    <div id="loading">LOADING...</div>
    <ul class="file-list" id="fileList" style="display:none"></ul>
    <div id="error" style="display:none"></div>
    <div class="footer">根目錄所有檔案</div>
  </div>

  <script>
    const REPO = 'tomhuang223344/1Dm06ZnxArSMp5tW2JPc0Jk0ElQxZF';

    function getIcon(name) {
      const ext = name.split('.').pop().toLowerCase();
      const icons = {
        html: '🌐',
        css: '🎨',
        js: '⚙️',
        json: '📦',
        md: '📄',
        png: '🖼️',
        jpg: '🖼️',
        jpeg: '🖼️',
        gif: '🖼️',
        svg: '🖼️',
        pdf: '📑',
        xlsx: '📊',
        xls: '📊',
        csv: '📊',
        txt: '📝',
        zip: '📁',
      };
      return icons[ext] || '📎';
    }

    function isWebFile(name) {
      const webExts = ['html', 'htm', 'php', 'asp', 'aspx', 'jsp', 'xml', 'svg', 'css', 'js'];
      const ext = name.split('.').pop().toLowerCase();
      return webExts.includes(ext);
    }

    function isImageFile(name) {
      const imgExts = ['png', 'jpg', 'jpeg', 'gif', 'svg', 'webp', 'bmp'];
      const ext = name.split('.').pop().toLowerCase();
      return imgExts.includes(ext);
    }

    function buildUrl(item) {
      const ext = item.name.split('.').pop().toLowerCase();
      if (isWebFile(item.name)) {
        return item.download_url.replace('/contents/', '/').replace('/raw/', '/');
      }
      if (isImageFile(item.name)) {
        return item.download_url;
      }
      return item.download_url;
    }

    fetch(`https://api.github.com/repos/${REPO}/contents/`)
      .then(r => r.json())
      .then(data => {
        const listEl = document.getElementById('fileList');
        const loadingEl = document.getElementById('loading');
        const errorEl = document.getElementById('error');

        if (Array.isArray(data)) {
          // 優先顯示網頁檔
          const webFiles = data.filter(f => !f.type || f.type === 'file');
          webFiles.sort((a, b) => {
            if (a.name === 'index.html') return -1;
            if (b.name === 'index.html') return 1;
            return a.name.localeCompare(b.name);
          });

          webFiles.forEach(item => {
            const li = document.createElement('li');
            li.className = 'file-item';
            const icon = getIcon(item.name);
            const url = isWebFile(item.name) ? item.name : item.download_url;

            li.innerHTML = `
              <span class="file-icon">${icon}</span>
              <div class="file-info">
                <div class="file-name">${item.name}</div>
                <div class="file-meta">${isWebFile(item.name) ? '🌐 網頁檔案' : isImageFile(item.name) ? '🖼️ 圖片檔' : '📎 其他檔案'}</div>
              </div>
              <span class="file-arrow">→</span>
            `;
            li.addEventListener('click', () => {
              window.location.href = url;
            });
            listEl.appendChild(li);
          });

          loadingEl.style.display = 'none';
          listEl.style.display = 'flex';
        } else if (data.message && data.message.startsWith('API rate limit')) {
          errorEl.style.display = 'block';
          errorEl.textContent = 'Rate limit exceeded. Please wait a moment.';
          loadingEl.style.display = 'none';
        } else {
          errorEl.style.display = 'block';
          errorEl.textContent = '無法讀取檔案目錄';
          loadingEl.style.display = 'none';
        }
      })
      .catch(err => {
        const errorEl = document.getElementById('error');
        const loadingEl = document.getElementById('loading');
        errorEl.style.display = 'block';
        errorEl.textContent = '錯誤：' + err.message;
        loadingEl.style.display = 'none';
      });
  </script>
</body>
</html>
