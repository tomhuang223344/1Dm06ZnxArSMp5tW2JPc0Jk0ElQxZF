<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>騎自行車的鵜鶘 🦩</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(to bottom, #8ed6ff 0%, #d9f2ff 75%);
    font-family: "Microsoft JhengHei", sans-serif;
    overflow: hidden;
  }

  .title {
    position: absolute;
    top: 30px;
    left: 0; right: 0;
    text-align: center;
    color: #1a6fb0;
    font-size: 28px;
    font-weight: bold;
    text-shadow: 0 2px 4px rgba(255,255,255,.6);
  }

  .scene { position: relative; width: 760px; height: 430px; overflow: hidden; }

  /* ---- 太陽 ---- */
  .sun {
    position: absolute; top: 38px; right: 52px;
    width: 74px; height: 74px; border-radius: 50%;
    background: radial-gradient(circle, #fff3b0, #ffd64d);
    box-shadow: 0 0 40px 10px rgba(255,214,77,.55);
  }

  /* ---- 雲 ---- */
  .cloud {
    position: absolute; background: #fff; border-radius: 50px; opacity: .92;
    animation: drift linear infinite;
  }
  .cloud::before, .cloud::after {
    content:""; position:absolute; background:#fff; border-radius:50%;
  }
  .c1 { width:130px; height:42px; top:70px; animation-duration:38s; }
  .c1::before{width:60px;height:60px;top:-26px;left:20px;}
  .c1::after {width:50px;height:50px;top:-20px;left:70px;}
  .c2 { width:100px; height:34px; top:130px; animation-duration:52s; animation-delay:-18s; }
  .c2::before{width:46px;height:46px;top:-20px;left:16px;}
  .c2::after {width:40px;height:40px;top:-16px;left:56px;}

  @keyframes drift { from { left: -170px; } to { left: 800px; } }

  /* ---- 地面 / 草地 ---- */
  .ground { position:absolute; bottom:0; width:100%; height:56px; background:#7cc46a; border-top:4px solid #5fae4f; }
  .road   { position:absolute; bottom:30px; width:100%; height:28px; background:#6b6f76; }

  /* ---- 車道白線(滾動) ---- */
  .dashes { position:absolute; bottom:41px; left:0; width:200%; height:5px; display:flex; }
  .dashes span { flex:0 0 auto; width:60px; height:5px; background:#fff; margin-right:60px; border-radius:3px; }
  .dashes { animation: roadmove .9s linear infinite; }
  @keyframes roadmove { from{transform:translateX(0);} to{transform:translateX(-120px);} }

  /* ---- 草地草叢(滾動) ---- */
  .grass-strip { position:absolute; bottom:48px; left:0; width:200%; height:14px; display:flex; animation: roadmove 1.3s linear infinite; }
  .grass-strip span{ flex:0 0 auto; width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:16px solid #5fae4f; margin-right:48px;}

  /* ---- 鵜鶘 + 自行車(整體上下輕微彈跳) ---- */
  .rider { position:absolute; left:230px; bottom:52px; width:320px; height:260px; animation:bob .8s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-4px);} }

  /* ---- 自行車 ---- */
  .bike { position:absolute; bottom:0; width:320px; height:260px; }

  .wheel {
    position:absolute; bottom:14px; width:78px; height:78px; border-radius:50%;
    border:7px solid #3a3f45; background:transparent;
  }
  .wheel::before, .wheel::after { content:""; position:absolute; top:50%; left:50%; width:64px; height:2.5px; background:#9aa0a6; transform-origin:center; }
  .wheel::before{transform:translate(-50%,-50%) rotate(0deg);}
  .wheel::after {transform:translate(-50%,-50%) rotate(90deg);}
  .hub{position:absolute;top:50%;left:50%;width:12px;height:12px;border-radius:50%;background:#3a3f45;transform:translate(-50%,-50%);z-index:2;}

  .w-back { left:28px; }
  .w-front{ right:28px; }
  /* 輪子內圈用 svg 做完整輻條,旋轉 */
  .spokes{position:absolute;top:50%;left:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;animation:spin .9s linear infinite;}
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 車架 */
  .frame{position:absolute;bottom:44px;left:70px;width:180px;height:95px;}
  .tube{position:absolute;background:#e2483d;border-radius:6px;}
  .t1{left:0;top:58px;width:120px;height:9px;transform-origin:left center;transform:rotate(2deg);}      /* 下管 */
  .t2{left:70px;top:4px;width:10px;height:64px;}                                                     /* 座管 */
  .t3{left:70px;top:4px;width:95px;height:9px;transform-origin:left center;transform:rotate(8deg);}     /* 上管 */
  .t4{left:165px;top:20px;width:14px;height:60px;transform-origin:center;transform:rotate(-12deg);}    /* 前叉 */
  .seat{position:absolute;left:58px;top:-6px;width:34px;height:9px;background:#3a3f45;border-radius:6px;}
  .bar {position:absolute;left:170px;top:-2px;width:9px;height:34px;background:#3a3f45;border-radius:5px;transform:rotate(-18deg);}
  .handle{position:absolute;left:160px;top:-8px;width:26px;height:8px;background:#3a3f45;border-radius:6px;}

  /* 踏板 + 曲柄(旋轉) */
  .crank{position:absolute;bottom:44px;left:120px;width:60px;height:60px;margin:-30px 0 0 -30px;animation:spin .9s linear infinite;}
  .pedal-arm{position:absolute;top:50%;left:50%;width:60px;height:8px;background:#2b2f34;border-radius:4px;transform-origin:center;}
  .pedal{position:absolute;width:22px;height:9px;background:#2b2f34;border-radius:3px;top:50%;}
  .p1{left:-11px;transform:translateY(-50%);}
  .p2{right:-11px;transform:translateY(-50%);}

  /* ---- 鵜鶘 ---- */
  .pelican { position:absolute; bottom:78px; left:60px; width:150px; height:200px; }
  .body{position:absolute;bottom:34px;left:34px;width:96px;height:78px;background:#f7a8c0;border-radius:55% 55% 50% 50%;box-shadow:inset -12px -10px 0 rgba(214,120,150,.35);}
  .wing{position:absolute;bottom:44px;left:48px;width:70px;height:52px;background:#ef8fb0;border-radius:60% 60% 40% 40%;box-shadow:inset -8px -6px 0 rgba(214,120,150,.3);}
  .tail{position:absolute;bottom:70px;left:118px;width:34px;height:22px;background:#ef8fb0;border-radius:0 60% 60% 0;transform:rotate(18deg);}

  /* 腿(踩踏板) */
  .leg{position:absolute;bottom:52px;left:74px;width:9px;height:44px;background:#f2b53c;border-radius:5px;transform-origin:top center;animation:pedal 1.8s ease-in-out infinite;}
  @keyframes pedal { 0%,100%{transform:rotate(-16deg);} 50%{transform:rotate(16deg);} }

  /* 頭 + 長脖子 */
  .neck{position:absolute;bottom:96px;left:112px;width:30px;height:84px;background:#f7a8c0;border-radius:40%;transform-origin:bottom center;animation:sway 2.6s ease-in-out infinite;}
  @keyframes sway{0%,100%{transform:rotate(-3deg);}50%{transform:rotate(3deg);}}

  .head{position:absolute;top:4px;left:-8px;width:44px;height:38px;background:#f7a8c0;border-radius:50%;}
  /* 長喙 */
  .beak-top{position:absolute;top:12px;left:30px;width:66px;height:12px;background:#ffb43d;border-radius:0 12px 12px 0;transform-origin:left center;}
  /* 大喉嚨袋 */
  .pouch{position:absolute;top:22px;left:34px;width:74px;height:26px;background:#ff9e5c;border-radius:0 8px 60% 60%;}
  .eye{position:absolute;top:14px;left:24px;width:8px;height:8px;background:#2b2f34;border-radius:50%;}
  .eye::after{content:"";position:absolute;top:1.5px;left:1.5px;width:3px;height:3px;background:#fff;border-radius:50%;}

  /* 速度線 */
  .speed{position:absolute;bottom:96px;left:-40px;width:70px;height:6px;border-radius:6px;background:rgba(255,255,255,.8);animation:speedline .6s linear infinite;}
  .speed.s2{bottom:130px;animation-delay:.2s;}
  @keyframes speedline { from{transform:translateX(40px);opacity:0;} 40%{opacity:1;} to{transform:translateX(-30px);opacity:0;} }

  .caption{position:absolute;bottom:8px;left:0;right:0;text-align:center;color:#2f6b3a;font-size:15px;font-weight:bold;}
</style>
</head>
<body>
  <div class="title">🦩 騎自行車的鵜鶘 🚲</div>

  <div class="scene">
    <div class="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>

    <div class="ground"></div>
    <div class="road"></div>
    <div class="dashes" id="dashes"></div>
    <div class="grass-strip" id="grass"></div>

    <div class="rider">
      <!-- 鵜鶘 -->
      <div class="pelican">
        <div class="tail"></div>
        <div class="body"></div>
        <div class="wing"></div>
        <div class="leg"></div>
        <div class="neck">
          <div class="head">
            <div class="pouch"></div>
            <div class="beak-top"></div>
            <div class="eye"></div>
          </div>
        </div>
      </div>

      <!-- 自行車 -->
      <div class="bike">
        <div class="wheel w-back"><div class="spokes" id="spB"></div><div class="hub"></div></div>
        <div class="wheel w-front"><div class="spokes" id="spF"></div><div class="hub"></div></div>

        <div class="frame">
          <div class="tube t1"></div>
          <div class="tube t2"></div>
          <div class="tube t3"></div>
          <div class="tube t4"></div>
          <div class="seat"></div>
          <div class="bar"></div>
          <div class="handle"></div>
        </div>

        <div class="crank">
          <div class="pedal-arm"><div class="pedal p1"></div><div class="pedal p2"></div></div>
        </div>
      </div>

      <div class="speed"></div>
      <div class="speed s2"></div>
    </div>

    <div class="caption">牠踩得好用力,大嘴巴都快被風吹歪了~</div>
  </div>

<script>
  // 產生滾動的車道白線與草叢
  const dashes = document.getElementById('dashes');
  for (let i=0;i<24;i++) dashes.appendChild(document.createElement('span'));
  const grass = document.getElementById('grass');
  for (let i=0;i<26;i++) grass.appendChild(document.createElement('span'));

  // 產生輪輻條(多根線,讓旋轉看起來更真實)
  function buildSpokes(el){
    el.style.borderRadius='50%';
    for(let a=0;a<360;a+=45){
      const s=document.createElement('div');
      s.style.cssText=`position:absolute;top:50%;left:50%;width:1px;height:62px;background:#c9ced4;transform-origin:center;transform:translate(-50%,-50%) rotate(${a}deg);`;
      el.appendChild(s);
    }
  }
  buildSpokes(document.getElementById('spB'));
  buildSpokes(document.getElementById('spF'));
</script>
</body>
</html>
